<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Claudezilla</title>
  <desc id="desc">Firefox browser automation without Google.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/>
      <stop offset="0.62" stop-color="#120d0d"/>
      <stop offset="1" stop-color="#1b1110"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D14D32"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D14D32" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#D14D32" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D14D32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF7E0"/>
      <stop offset="0.5" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D14D32" stroke-opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <path d="M0 566H1200" stroke="#D14D32" stroke-opacity="0.35"/>
  <path d="M0 567H660" stroke="url(#accent)" stroke-width="3"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="84" y="100" fill="#FCD34D" font-size="18" font-weight="700" letter-spacing="5">CLAUDEZILLA / FIREFOX</text>
    <text x="80" y="208" fill="#F1F1F1" font-size="78" font-weight="700" letter-spacing="2">CLAUDEZILLA</text>
    <text x="84" y="264" fill="#D14D32" font-size="27" font-weight="700" letter-spacing="4">BROWSER AUTOMATION WITHOUT GOOGLE</text>
    <text x="84" y="356" fill="#FFFFFF" font-size="44" font-weight="700">Firefox-native MCP server</text>
    <text x="84" y="407" fill="#C8C8C8" font-size="24">Claude Code  •  Zero Telemetry  •  Fully Local</text>
    <text x="84" y="486" fill="#8F8F8F" font-size="22">Navigate. Interact. Inspect. Automate.</text>
  </g>

